<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier – Resto Shalome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <h1>🍽️ Resto Shalome</h1>
    </div>
    <nav class="nav">
      <a href="index.html">Accueil</a>
      <a href="menu.html">Menu</a>
      <a href="panier.html">Panier</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="menu" style="padding: 60px 5%;">
    <h2>Votre Panier</h2>
    
    <div id="panier-container" style="max-width: 800px; margin: 0 auto 40px;"></div>

    <div style="max-width: 800px; margin: 0 auto 40px; text-align: right; font-size: 1.8rem; font-weight: bold;">
      Total : <span id="total-panier" style="color: #e67e22;">0</span> FCFA
    </div>

    <!-- Options de paiement -->
    <div style="max-width: 800px; margin: 0 auto;">
      <h3 style="margin-bottom: 20px; text-align:center;">Choisissez votre mode de paiement</h3>
      
      <div id="payment-options" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;">
        <!-- Les boutons de paiement seront ajoutés par JS -->
      </div>

      <button onclick="envoyerCommandeWhatsApp()" 
              class="btn" 
              style="width: 100%; margin-top: 30px; padding: 18px; font-size: 1.1rem;">
        Envoyer la commande via WhatsApp
      </button>
    </div>
  </section>

  <footer class="footer">
    <p>© 2026 – Resto Shalome • Ouagadougou, Burkina Faso</p>
  </footer>

  <div id="notification" class="notification"></div>

  <script src="data.js"></script>
  <script src="panier.js"></script>
</body>
</html>
